---
# Source: popeye/templates/rbac/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: popeye-clusterrole
  labels:
    app.kubernetes.io/version: "v0.22.1"
    app.kubernetes.io/managed-by: Helm
rules:
  #base ressources
  - apiGroups: [""]
    verbs: ["get", "list"]
    resources:
      - configmaps
      - endpoints
      - horizontalpodautoscalers
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - secrets
      - serviceaccounts
      - services
  - apiGroups: ["apps"]
    verbs: ["get", "list"]
    resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
  - apiGroups: ["networking.k8s.io"]
    verbs: ["get", "list"]
    resources:
      - networkpolicies
      - ingresses
  - apiGroups: ["autoscaling"]
    verbs: ["get", "list"]
    resources:
      - horizontalpodautoscalers  
  - apiGroups: ["rbac.authorization.k8s.io"]
    verbs: ["get", "list"]
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
  - apiGroups: ["metrics.k8s.io"]
    verbs: ["get", "list"]
    resources:
      - pods
      - nodes
  - apiGroups: ["policy"]
    verbs: ["get", "list"]
    resources:
      - poddisruptionbudgets
      - podsecuritypolicies
